<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Flash Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace;
            color: #00ffcc;
        }
        #stage {
            width: 800px;
            height: 600px;
            background: #000;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            border: 2px solid #00ffcc;
        }
    </style>
</head>
<body>
    <div id="stage">
        
        <canvas id="flashCanvas" width="800" height="600"></canvas>
    </div>
    <script src="engine.js"></script>
</body>
</html>
